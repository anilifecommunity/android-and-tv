name: Draft GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, for example v0.1.0-beta.1
        required: true
        type: string
      title:
        description: Draft release title
        required: true
        type: string
      notes:
        description: Draft release notes
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: draft-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release
    env:
      ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
      MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
      SIMKL_CLIENT_ID: ${{ vars.SIMKL_CLIENT_ID }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      OPEN_SUBTITLES_API_KEY: ${{ secrets.OPEN_SUBTITLES_API_KEY }}
      KARTOONS_ACCOUNT_TOKENS: ${{ secrets.KARTOONS_ACCOUNT_TOKENS }}
      KARTOONS_TOKENS_MIRROR_URL: ${{ vars.KARTOONS_TOKENS_MIRROR_URL }}
      RIFT_FIREBASE_API_KEY: ${{ secrets.RIFT_FIREBASE_API_KEY }}
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TITLE: ${{ inputs.title }}
      RELEASE_NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          ! gh release view "$RELEASE_TAG" >/dev/null 2>&1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_CERT_SHA256"
          mkdir -p .release
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > .release/anilife-release.jks
          chmod 600 .release/anilife-release.jks
          {
            printf 'storeFile=.release/anilife-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_SIGNING_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Build release APKs
        run: ./gradlew :app:assembleMobileRelease :app:assembleTvRelease --max-workers=2 --no-configuration-cache --console=plain

      - name: Generate CycloneDX SBOM
        run: ./gradlew :app:cyclonedxDirectBom --max-workers=2 --no-configuration-cache --console=plain

      - name: Verify and stage release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(Anilife.apk Anilife_arm64-v8a.apk Anilife_armeabi-v7a.apk Anilife_tv.apk Anilife_tv_arm64-v8a.apk Anilife_tv_armeabi-v7a.apk)
          mkdir -p dist
          fingerprints=()
          for name in "${expected[@]}"; do
            mapfile -t matches < <(find app/build/outputs/apk -type f -name "$name")
            test "${#matches[@]}" -eq 1
            "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "${matches[0]}"
            "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 4 "${matches[0]}"
            fingerprints+=("$("$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "${matches[0]}" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p')")
            cp "${matches[0]}" "dist/$name"
          done
          mapfile -t unique_fingerprints < <(printf '%s\n' "${fingerprints[@]}" | tr '[:upper:]' '[:lower:]' | sort -u)
          test "${#unique_fingerprints[@]}" -eq 1
          test "${unique_fingerprints[0]}" = "${ANDROID_SIGNING_CERT_SHA256,,}"
          cp app/build/reports/cyclonedx-direct/bom.json dist/Anilife.cdx.json
          package_line="$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging dist/Anilife.apk | head -n 1)"
          app_version="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$package_line")"
          version_code="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$package_line")"
          test -n "$app_version"
          test -n "$version_code"
          for flavor in mobile tv; do
            mapping="app/build/outputs/mapping-archive/mapping-$flavor-v$app_version-$version_code-${GITHUB_SHA:0:12}.txt"
            test -s "$mapping"
            cp "$mapping" dist/
          done
          jq -e --arg version "$app_version" '
            .bomFormat == "CycloneDX" and
            .specVersion == "1.6" and
            .metadata.component.name == "Anilife" and
            .metadata.component.version == $version and
            .metadata.component.type == "application" and
            (.components | length) > 0 and
            (.dependencies | length) > 0
          ' dist/Anilife.cdx.json >/dev/null
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs dist/Anilife.apk |
            grep -E 'Signer #1 certificate DN|Signer #1 certificate SHA-256 digest|Signer #1 public key algorithm|Signer #1 public key size' \
            > dist/SIGNING-CERTIFICATE.txt
          printf '%s\n' "$RELEASE_NOTES" > release-notes.txt

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.apk
          sbom-path: dist/Anilife.cdx.json

      - name: Stage attestations and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" dist/BUILD-PROVENANCE.intoto.jsonl
          cp "${{ steps.sbom.outputs.bundle-path }}" dist/SBOM-ATTESTATION.intoto.jsonl
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )

      - name: Create draft prerelease
        shell: bash
        run: gh release create "$RELEASE_TAG" dist/* --draft --prerelease --title "$RELEASE_TITLE" --notes-file release-notes.txt --target "$GITHUB_SHA"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f .release/anilife-release.jks keystore.properties
