name: Draft GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, for example v0.1.0-beta.1
        required: true
        type: string
      title:
        description: Draft release title
        required: true
        type: string
      notes:
        description: Draft release notes
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release
    env:
      ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
      MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
      SIMKL_CLIENT_ID: ${{ vars.SIMKL_CLIENT_ID }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      OPEN_SUBTITLES_API_KEY: ${{ secrets.OPEN_SUBTITLES_API_KEY }}
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TITLE: ${{ inputs.title }}
      RELEASE_NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          ! gh release view "$RELEASE_TAG" >/dev/null 2>&1

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > .release/anilife-release.jks
          chmod 600 .release/anilife-release.jks
          {
            printf 'storeFile=.release/anilife-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_SIGNING_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Build release APKs
        run: ./gradlew :app:assembleMobileRelease :app:assembleTvRelease --max-workers=2 --no-configuration-cache --console=plain

      - name: Verify and stage release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(Anilife.apk Anilife_arm64-v8a.apk Anilife_armeabi-v7a.apk Anilife_tv.apk Anilife_tv_arm64-v8a.apk Anilife_tv_armeabi-v7a.apk)
          mkdir -p dist
          for name in "${expected[@]}"; do
            mapfile -t matches < <(find app/build/outputs/apk -type f -name "$name")
            test "${#matches[@]}" -eq 1
            "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "${matches[0]}"
            "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 4 "${matches[0]}"
            cp "${matches[0]}" "dist/$name"
          done
          sha256sum dist/*.apk > dist/SHA256SUMS
          printf '%s\n' "$RELEASE_NOTES" > release-notes.txt

      - name: Create draft prerelease
        shell: bash
        run: gh release create "$RELEASE_TAG" dist/* --draft --prerelease --title "$RELEASE_TITLE" --notes-file release-notes.txt --target "$GITHUB_SHA"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f .release/anilife-release.jks keystore.properties
