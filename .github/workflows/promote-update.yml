name: Publish signed update manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.1.0-beta.1
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      important:
        description: Prompt immediately for a same-version corrective build
        required: true
        default: none
        type: choice
        options:
          - none
          - mobile
          - tv
          - all
      expires_in_days:
        description: Manifest lifetime in days
        required: true
        default: "365"
        type: string
      web_index_only:
        description: Republish the existing signed stable event to the web index without notifying apps
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-update-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      UPDATE_CHANNEL: ${{ inputs.channel }}
      IMPORTANT: ${{ inputs.important }}
      EXPIRES_IN_DAYS: ${{ inputs.expires_in_days }}
      WEB_INDEX_ONLY: ${{ inputs.web_index_only }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - name: Check out publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/update-requirements.txt

      - name: Validate published release and APKs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$EXPIRES_IN_DAYS" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          release_json="$(cat release.json)"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          if [[ "$UPDATE_CHANNEL" = beta ]]; then
            test "$(jq -r '.prerelease' <<<"$release_json")" = "true"
            [[ "$RELEASE_TAG" = *-* ]]
          else
            test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
            [[ "$RELEASE_TAG" != *-* ]]
          fi
          if [[ "$WEB_INDEX_ONLY" = true ]]; then
            test "$UPDATE_CHANNEL" = stable
          fi
          mkdir release
          gh release download "$RELEASE_TAG" --dir release
          for apk in \
            Anilife.apk \
            Anilife_arm64-v8a.apk \
            Anilife_armeabi-v7a.apk \
            Anilife_tv.apk \
            Anilife_tv_arm64-v8a.apk \
            Anilife_tv_armeabi-v7a.apk; do
            test -s "release/$apk"
          done
          test -s release/SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)

          mobile_package="$($ANDROID_HOME/build-tools/35.0.1/aapt dump badging release/Anilife.apk | head -n 1)"
          tv_package="$($ANDROID_HOME/build-tools/35.0.1/aapt dump badging release/Anilife_tv.apk | head -n 1)"
          app_version="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$mobile_package")"
          version_code="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$mobile_package")"
          test "$RELEASE_TAG" = "v$app_version"
          grep -q "versionName='$app_version'" <<<"$tv_package"
          grep -q "versionCode='$version_code'" <<<"$tv_package"
          for apk in release/Anilife.apk release/Anilife_tv.apk; do
            verify_output="$($ANDROID_HOME/build-tools/35.0.1/apksigner verify --verbose "$apk" 2>&1)" || {
              printf '%s\n' "$verify_output"
              exit 1
            }
            fingerprint="$($ANDROID_HOME/build-tools/35.0.1/apksigner verify --print-certs "$apk" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test "${fingerprint,,}" = "${ANDROID_SIGNING_CERT_SHA256,,}"
          done
          {
            echo "APP_VERSION=$app_version"
            echo "VERSION_CODE=$version_code"
            echo "MOBILE_SHA256=$(sha256sum release/Anilife.apk | cut -d' ' -f1)"
            echo "TV_SHA256=$(sha256sum release/Anilife_tv.apk | cut -d' ' -f1)"
            echo "MOBILE_SIZE=$(stat -c%s release/Anilife.apk)"
            echo "TV_SIZE=$(stat -c%s release/Anilife_tv.apk)"
          } >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.txt

      - name: Sign canonical update manifest
        if: ${{ !inputs.web_index_only }}
        shell: bash
        env:
          NOSTR_UPDATE_SECRET: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes \
            -r scripts/update-requirements.txt
          args=(
            publish
            --version "$APP_VERSION"
            --version-code "$VERSION_CODE"
            --sequence "$VERSION_CODE"
            --channel "$UPDATE_CHANNEL"
            --expires-in-days "$EXPIRES_IN_DAYS"
            --apk-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Anilife.apk"
            --apk-sha256 "$MOBILE_SHA256"
            --size-bytes "$MOBILE_SIZE"
            --tv-apk-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Anilife_tv.apk"
            --tv-apk-sha256 "$TV_SHA256"
            --tv-size-bytes "$TV_SIZE"
            --changelog "$(cat release-notes.txt)"
            --write-event update.json
            --dry-run
          )
          if [[ "$IMPORTANT" != none ]]; then
            args+=(--important "$IMPORTANT")
          fi
          python scripts/nostr_update.py "${args[@]}"
          jq -e '
            .pubkey == "dc30dfa5ab26f3fa076dd6ce0cdade53fa47e7db6a750908a954084afb06b46c" and
            (.content | fromjson | .schema == 1)
          ' update.json >/dev/null

      - name: Verify existing signed update manifest
        if: ${{ inputs.web_index_only }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes \
            -r scripts/update-requirements.txt
          cp release/update.json update.json
          python -c 'import json, sys; sys.path.insert(0, "scripts"); from nostr_update import verify_event; assert verify_event(json.load(open("update.json", encoding="utf-8")))'
          jq -e '
            .pubkey == "dc30dfa5ab26f3fa076dd6ce0cdade53fa47e7db6a750908a954084afb06b46c" and
            (.content | fromjson | .schema == 1)
          ' update.json >/dev/null

      - name: Mirror and broadcast the signed event
        if: ${{ !inputs.web_index_only }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" update.json --clobber
          python scripts/nostr_update.py broadcast-file update.json

      - name: Build stable web download index
        if: ${{ inputs.channel == 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_download_index.py \
            --release-json release.json \
            --event update.json \
            --checksums release/SHA256SUMS \
            --asset-dir release \
            --repository "$GITHUB_REPOSITORY" \
            --output downloads.json

      - name: Publish and verify stable web download index
        if: ${{ inputs.channel == 'stable' }}
        shell: bash
        env:
          WEB_RELEASE_INDEX_HMAC_KEY: ${{ secrets.WEB_RELEASE_INDEX_HMAC_KEY }}
          WEB_RELEASE_INDEX_PUBLISH_URL: ${{ vars.WEB_RELEASE_INDEX_PUBLISH_URL }}
          WEB_RELEASE_INDEX_PUBLIC_URL: ${{ vars.WEB_RELEASE_INDEX_PUBLIC_URL }}
        run: |
          set -euo pipefail
          test -n "$WEB_RELEASE_INDEX_HMAC_KEY"
          test -n "$WEB_RELEASE_INDEX_PUBLISH_URL"
          test -n "$WEB_RELEASE_INDEX_PUBLIC_URL"

          timestamp="$(date +%s)"
          signature="$(INDEX_TIMESTAMP="$timestamp" python - <<'PY'
          import hashlib
          import hmac
          import os
          from pathlib import Path

          body = Path("downloads.json").read_bytes()
          message = os.environ["INDEX_TIMESTAMP"].encode() + b"\n" + body
          print(hmac.new(os.environ["WEB_RELEASE_INDEX_HMAC_KEY"].encode(), message, hashlib.sha256).hexdigest())
          PY
          )"

          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST "$WEB_RELEASE_INDEX_PUBLISH_URL" \
            --header "Content-Type: application/json" \
            --header "X-Anilife-Timestamp: $timestamp" \
            --header "X-Anilife-Signature: v1=$signature" \
            --data-binary @downloads.json \
            --output publish-response.json

          expected_sha256="$(sha256sum downloads.json | cut -d' ' -f1)"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --header "Cache-Control: no-cache" \
              "$WEB_RELEASE_INDEX_PUBLIC_URL?verify=$timestamp" \
              --output live-downloads.json; then
              live_sha256="$(sha256sum live-downloads.json | cut -d' ' -f1)"
              if [[ "$live_sha256" = "$expected_sha256" ]]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Published web download index did not become visible within 60 seconds" >&2
          exit 1
