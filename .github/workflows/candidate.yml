name: Signed release candidate

on:
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: signed-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build:
    name: Build and verify six signed APKs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release
    env:
      ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
      MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
      SIMKL_CLIENT_ID: ${{ vars.SIMKL_CLIENT_ID }}
      DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      OPEN_SUBTITLES_API_KEY: ${{ secrets.OPEN_SUBTITLES_API_KEY }}
      KARTOONS_ACCOUNT_TOKENS: ${{ secrets.KARTOONS_ACCOUNT_TOKENS }}
      KARTOONS_TOKENS_MIRROR_URL: ${{ vars.KARTOONS_TOKENS_MIRROR_URL }}
      RIFT_FIREBASE_API_KEY: ${{ secrets.RIFT_FIREBASE_API_KEY }}
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ vars.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: true

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_CERT_SHA256"
          mkdir -p .release
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > .release/anilife-release.jks
          chmod 600 .release/anilife-release.jks
          {
            printf 'storeFile=.release/anilife-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_SIGNING_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Build release APKs
        run: ./gradlew :app:assembleMobileRelease :app:assembleTvRelease --max-workers=2 --no-configuration-cache --console=plain

      - name: Generate CycloneDX SBOM
        run: ./gradlew :app:cyclonedxDirectBom --max-workers=2 --no-configuration-cache --console=plain

      - name: Verify release signatures and asset contract
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            Anilife.apk
            Anilife_arm64-v8a.apk
            Anilife_armeabi-v7a.apk
            Anilife_tv.apk
            Anilife_tv_arm64-v8a.apk
            Anilife_tv_armeabi-v7a.apk
          )
          mkdir -p dist
          fingerprints=()
          for name in "${expected[@]}"; do
            mapfile -t matches < <(find app/build/outputs/apk -type f -name "$name")
            test "${#matches[@]}" -eq 1
            "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "${matches[0]}"
            "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 4 "${matches[0]}"
            fingerprints+=("$("$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "${matches[0]}" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p')")
            cp "${matches[0]}" "dist/$name"
          done
          mapfile -t unique_fingerprints < <(printf '%s\n' "${fingerprints[@]}" | tr '[:upper:]' '[:lower:]' | sort -u)
          test "${#unique_fingerprints[@]}" -eq 1
          test "${unique_fingerprints[0]}" = "${ANDROID_SIGNING_CERT_SHA256,,}"
          cp app/build/reports/cyclonedx-direct/bom.json dist/Anilife.cdx.json
          app_version="$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging dist/Anilife.apk |
            sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          test -n "$app_version"
          jq -e --arg version "$app_version" '
            .bomFormat == "CycloneDX" and
            .specVersion == "1.6" and
            .metadata.component.name == "Anilife" and
            .metadata.component.version == $version and
            .metadata.component.type == "application" and
            (.components | length) > 0 and
            (.dependencies | length) > 0
          ' dist/Anilife.cdx.json >/dev/null
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs dist/Anilife.apk |
            grep -E 'Signer #1 certificate DN|Signer #1 certificate SHA-256 digest|Signer #1 public key algorithm|Signer #1 public key size' \
            > dist/SIGNING-CERTIFICATE.txt

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.apk

      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: dist/*.apk
          sbom-path: dist/Anilife.cdx.json

      - name: Stage attestations and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" dist/BUILD-PROVENANCE.intoto.jsonl
          cp "${{ steps.sbom.outputs.bundle-path }}" dist/SBOM-ATTESTATION.intoto.jsonl
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload signed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anilife-signed-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f .release/anilife-release.jks keystore.properties
